<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Machine Log</title>
<style>
:root{color-scheme:dark;--bg:#08111e;--panel:#111d2d;--panel2:#17263a;--line:#30445f;--text:#f2f6fc;--muted:#9caec5;--blue:#70aaff;--cyan:#58d6d2;--red:#ef6b72;--yellow:#f1ca4b}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0,#34538d35,transparent 38%),var(--bg);color:var(--text);font:13px/1.4 "Segoe UI Variable","Segoe UI",sans-serif;min-height:100vh}
button,input,select{font:inherit}.shell{padding:13px 18px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:46px;padding:3px 0 7px;position:sticky;top:0;z-index:5;background:#08111eea;backdrop-filter:blur(12px)}
.title{align-self:stretch;display:flex;flex-direction:column;justify-content:center}.title h1{margin:0;font-size:23px;line-height:1}.title p{margin:4px 0 0;color:var(--muted);font-size:11px;line-height:1.2}.top>.actions{padding-right:44px}.actions,.table-actions,.form-actions{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
button{min-height:28px;border:1px solid #6ea8ff66;border-radius:7px;padding:4px 9px;background:#6ca8ff18;color:var(--text);cursor:pointer}button:hover{border-color:var(--blue);background:#6ca8ff2c}.primary{background:linear-gradient(145deg,#4e9afa,#496ae4);border-color:#8fc2ff;color:white}.danger{border-color:#ef6b7266;background:#ef6b7212;color:#ff9aa0}
.status{display:none}.status.error{display:block;position:fixed;z-index:15;top:64px;left:50%;transform:translateX(-50%);max-width:min(620px,calc(100vw - 32px));padding:7px 11px;border:1px solid #ef6b7277;border-radius:8px;background:#32171bea;color:#ff9aa0;font-size:11px;box-shadow:0 8px 24px #0008}.empty{padding:70px 20px;text-align:center;border:1px dashed var(--line);border-radius:10px;color:var(--muted)}.empty strong{display:block;color:var(--text);font-size:20px;margin-bottom:7px}
.new-table,.editor{display:none;margin:6px 0;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}.new-table.open,.editor.open{display:block}.form-line{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:6px}.form-line input,.record-grid input:not([type="checkbox"]),.record-grid select{width:100%;min-width:0;height:28px;border:1px solid #526985;border-radius:6px;background:#0a1422;color:var(--text);padding:4px 7px}
.tables{display:grid;gap:7px}.table-card{border:1px solid var(--line);border-radius:9px;background:linear-gradient(145deg,#142236,#0c1624);overflow:hidden}.table-head{display:grid;grid-template-columns:1fr minmax(430px,620px) 1fr;align-items:center;gap:9px;padding:6px 9px;background:#ffffff05;border-bottom:1px solid var(--line)}.table-head h2{margin:0;font-size:14px;justify-self:start}.table-head .table-actions{justify-self:end}.record-filters{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;width:100%;justify-self:center}.record-filter{width:100%;min-width:0;height:28px;border:1px solid #6ea8ff66;border-radius:7px;padding:3px 25px 3px 8px;background:#101d2d;color:var(--text)}.fields{display:flex;gap:5px;flex-wrap:wrap;padding:5px 9px;border-bottom:1px solid #30445f88}.field{display:flex;align-items:center;gap:5px;padding:2px 6px;border:1px solid #58708d;border-radius:999px;background:#ffffff07;font-size:9px}.field button{min-height:0;border:0;background:transparent;padding:0;color:#ff9aa0}
.record-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:6px}.record-field label{display:block;margin-bottom:2px;color:var(--muted);font-size:8px;font-weight:700;text-transform:uppercase;letter-spacing:.7px}.record-field.optional-rom{display:none}.record-field.optional-rom.open{display:block}.form-actions{justify-content:flex-end;margin-top:6px}
.fix-picker{position:relative}.fix-picker summary{height:28px;display:flex;align-items:center;padding:4px 7px;border:1px solid #526985;border-radius:6px;background:#0a1422;color:var(--text);cursor:pointer;list-style:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.fix-picker summary::-webkit-details-marker{display:none}.fix-picker summary::after{content:"▾";margin-left:auto;color:var(--blue)}.fix-picker[open] summary{border-color:var(--blue)}.fix-options{position:absolute;z-index:12;top:31px;right:0;min-width:310px;padding:5px;border:1px solid #526985;border-radius:7px;background:#0a1422;box-shadow:0 12px 30px #000b}.fix-option{display:flex!important;align-items:center;gap:7px;margin:0!important;padding:6px 7px;border-radius:5px;color:var(--text)!important;font-size:10px!important;font-weight:400!important;text-transform:none!important;letter-spacing:0!important;cursor:pointer}.fix-option:hover{background:#6ca8ff1c}.fix-option input{width:15px;height:15px;margin:0;accent-color:#5d9fff}.fix-done{display:block;width:100%;margin-top:4px}.fix-cell{display:grid;gap:2px}.fix-line{white-space:nowrap}.fix-line strong{color:#fff}
.scroll{overflow:auto}table{width:100%;border-collapse:collapse;min-width:520px}th,td{padding:2px 6px;text-align:left;border-bottom:1px solid #30445f88;vertical-align:middle;line-height:1.05}th{height:20px;color:#9dc5ff;background:#ffffff05;font-size:8px;text-transform:uppercase;letter-spacing:.6px}td{height:21px;font-size:9px;max-width:300px;overflow-wrap:anywhere}th:first-child,td:first-child{width:18%;max-width:210px}tbody tr:nth-child(even){background:rgba(255,255,255,.025)}td:last-child{width:72px;white-space:nowrap}.row-button{min-height:18px;height:18px;padding:0 5px;border-radius:5px;font-size:8px;line-height:1}.no-records{padding:10px;text-align:center;color:var(--muted)}
.modal{position:fixed;inset:0;z-index:20;display:none;place-items:center;padding:20px;background:#030814c9}.modal.open{display:grid}.confirm{width:min(390px,100%);padding:16px;border:1px solid var(--line);border-radius:10px;background:var(--panel);box-shadow:0 25px 70px #000a}.confirm h3{margin:0 0 6px}.confirm p{color:var(--muted);margin:0 0 14px}
@media(max-width:700px){.top{align-items:flex-start;flex-direction:column}.form-line{grid-template-columns:1fr}.shell{padding:11px}.table-head{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<main class="shell">
  <header class="top">
    <div class="title"><h1>Machine Log</h1></div>
    <div class="actions"><button id="saveAll">Save</button><button class="danger" id="resetAll">Reset</button></div>
  </header>
  <div class="status" id="status" aria-live="polite"></div>
  <section class="new-table" id="newTableForm">
    <div class="form-line"><input id="newTableName" maxlength="80" placeholder="Table name, such as Machine Compatibility"><button class="primary" id="createTable">Create</button><button id="cancelTable">Cancel</button></div>
  </section>
  <section class="empty" id="empty" hidden><strong>No tables yet</strong>Create a table to begin organizing machine information.</section>
  <section class="tables" id="tables"></section>
</main>
<div class="modal" id="confirmModal"><section class="confirm" role="dialog" aria-modal="true"><h3 id="confirmTitle">Confirm</h3><p id="confirmText"></p><div class="form-actions"><button id="confirmCancel">Cancel</button><button class="danger" id="confirmAccept">Delete</button></div></section></div>
<script>
const $ = selector => document.querySelector(selector);
let project = {projectName:"Machine Log",tables:[]};
let consoles = [];
const machineFilters = new Map();
const graphicsFilters = new Map();
const fixFilters = new Map();
let pendingConfirm = null;
let editingRecord = null;
let autosaveTimer = null;
let autosaveQueue = Promise.resolve();
const safe = value => String(value ?? "").replace(/[&<>"']/g,character => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[character]));
const slug = value => String(value).toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,70) || ("table-"+Date.now());
function setStatus(message,error=false){const node=$("#status");node.textContent=error?message:"";node.classList.toggle("error",error)}
async function request(url,options={}){const response=await fetch(url,{cache:"no-store",...options});const result=await response.json();if(!response.ok||!result.ok)throw new Error(result.error||"Machine Log request failed.");return result}
async function load(){try{const result=await request("/api/machine-log");project=result.project;consoles=Array.isArray(result.consoles)?result.consoles:[];render();setStatus("Machine Log ready")}catch(error){setStatus(error.message,true)}}
async function save(message="Machine Log saved"){try{const result=await request("/api/machine-log",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({project})});project=result.project;render();setStatus(message)}catch(error){setStatus(error.message,true);throw error}}
function showNewTable(){const form=$("#newTableForm");form.classList.add("open");$("#newTableName").value="";$("#newTableName").focus()}
function tableById(id){return project.tables.find(table=>table.id===id)}
function fieldInputId(tableId,index){return `record-${tableId}-${index}`}
function isConsoleField(field){return String(field).trim().toLowerCase()==="console"}
function isCompatibilityField(field){return String(field).trim().toLowerCase()==="compatibility"}
function isMachineNameField(field){return String(field).trim().toLowerCase()==="machine / system name"}
function isRomField(field){return String(field).trim().toLowerCase()==="rom"}
function isGraphicsField(field){return String(field).trim().toLowerCase()==="graphics"}
function isFixesField(field){return String(field).trim().toLowerCase()==="fixes"}
const fixOptions=["Vulkan — Write Color Buffers: Off → On","Vulkan — MSAA: Auto → Disabled"];
function parseFixes(value){return String(value||"").split("\n").map(item=>item.trim()).filter(Boolean)}
function fixesChoices(selected="",includeAll=false){const first=includeAll?'<option value="">All Fixes</option>':'<option value="">Choose Fixes</option>';return first+fixOptions.map(value=>`<option value="${safe(value)}"${value===selected?' selected':''}>${safe(value)}</option>`).join("")}
function fixMarkup(value){const match=String(value).match(/^([^:]+:)(.*?)(→\s*)(.*)$/);return match?`<strong>${safe(match[1])}</strong>${safe(match[2])}${safe(match[3])}<strong>${safe(match[4])}</strong>`:safe(value)}
function fixesEditor(tableId,index){const id=fieldInputId(tableId,index);return `<details class="fix-picker"><summary>Choose Fixes</summary><div class="fix-options">${fixOptions.map((value,optionIndex)=>`<label class="fix-option"><input type="checkbox" data-fix-option="${optionIndex}"><span>${fixMarkup(value)}</span></label>`).join("")}<button type="button" class="fix-done" data-action="close-fixes">Done</button></div><input type="hidden" id="${id}" data-field-index="${index}"></details>`}
function syncFixPicker(picker){if(!picker)return;const hidden=picker.querySelector('input[type="hidden"]'),selected=[...picker.querySelectorAll('[data-fix-option]:checked')].map(box=>fixOptions[Number(box.dataset.fixOption)]).filter(Boolean);hidden.value=selected.join("\n");picker.querySelector("summary").textContent=selected.length?`${selected.length} fix${selected.length===1?"":"es"} selected`:"Choose Fixes"}
function setFixPickerValue(picker,value){const selected=new Set(parseFixes(value));picker?.querySelectorAll('[data-fix-option]').forEach(box=>{box.checked=selected.has(fixOptions[Number(box.dataset.fixOption)])});syncFixPicker(picker)}
function labelConsoleOnlyRecord(values,fields){const consoleField=fields.find(isConsoleField),romField=fields.find(isRomField);if(consoleField&&romField&&values[consoleField]&&!values[romField])values[romField]="-";return values}
function consoleChoices(selected="",includeAll=false){const first=includeAll?'<option value="">All Consoles</option>':'<option value="">Choose Console</option>';return first+consoles.map(console=>`<option value="${safe(console.name)}"${console.name===selected?' selected':''}>${safe(console.name)}</option>`).join("")}
function compatibilityChoices(selected="",includeAll=false){const first=includeAll?'<option value="">All Compatibility</option>':'<option value="">Choose Compatibility</option>';return first+["Great","Playable","Not Playable"].map(value=>`<option value="${value}"${value===selected?' selected':''}>${value}</option>`).join("")}
function graphicsChoices(selected="",includeAll=false){const first=includeAll?'<option value="">All Graphics</option>':'<option value="">Choose Graphics</option>';return first+["Vega 8","AMD Radeon 780M"].map(value=>`<option value="${value}"${value===selected?' selected':''}>${value}</option>`).join("")}
function machineChoices(table,selected=""){const field=table.fields.find(isMachineNameField),names=field?[...new Set(table.records.map(record=>String(record[field]||"").trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,undefined,{numeric:true,sensitivity:"base"})):[];return '<option value="">All Machines / Systems</option>'+names.map(name=>`<option value="${safe(name)}"${name===selected?' selected':''}>${safe(name)}</option>`).join("")}
function render(){
  const container=$("#tables");$("#empty").hidden=project.tables.length>0;
  container.innerHTML=project.tables.map(table=>`<article class="table-card" data-table="${safe(table.id)}">
    <header class="table-head"><h2>${safe(table.name)}</h2><div class="record-filters">${table.fields.some(isMachineNameField)?`<select class="record-filter" data-machine-filter="${safe(table.id)}" aria-label="Filter ${safe(table.name)} by machine or system">${machineChoices(table,machineFilters.get(table.id)||"")}</select>`:""}${table.fields.some(isGraphicsField)?`<select class="record-filter" data-graphics-filter="${safe(table.id)}" aria-label="Filter ${safe(table.name)} by graphics">${graphicsChoices(graphicsFilters.get(table.id)||"",true)}</select>`:""}${table.fields.some(isFixesField)?`<select class="record-filter" data-fixes-filter="${safe(table.id)}" aria-label="Filter ${safe(table.name)} by fix">${fixesChoices(fixFilters.get(table.id)||"",true)}</select>`:""}</div><div class="table-actions"><button data-action="record">Add Record</button></div></header>
    <section class="editor record-editor"><div class="record-grid">${table.fields.map((field,index)=>`<div class="record-field${isRomField(field)?" optional-rom":""}"><label for="${fieldInputId(table.id,index)}">${safe(field)}</label>${isConsoleField(field)?`<select id="${fieldInputId(table.id,index)}" data-field-index="${index}">${consoleChoices()}</select>`:isGraphicsField(field)?`<select id="${fieldInputId(table.id,index)}" data-field-index="${index}">${graphicsChoices()}</select>`:isCompatibilityField(field)?`<select id="${fieldInputId(table.id,index)}" data-field-index="${index}">${compatibilityChoices()}</select>`:isFixesField(field)?fixesEditor(table.id,index):`<input id="${fieldInputId(table.id,index)}" data-field-index="${index}" maxlength="2000">`}</div>`).join("")}</div><div class="form-actions">${table.fields.some(isRomField)?'<button data-action="toggle-rom" title="Add a specific ROM">＋ ROM</button>':""}<button class="primary" data-action="save-record">Save Record</button><button class="primary" data-action="save-record-add" title="Save and add another record for this machine" aria-label="Save and add another record for this machine">＋</button><button data-action="cancel-editor">Cancel</button></div></section>
    ${renderRecords(table)}
  </article>`).join("");
}
function renderRecords(table){
  if(!table.fields.length)return '<div class="no-records">Add fields before adding records.</div>';
  const machineField=table.fields.find(isMachineNameField),machineFilter=machineFilters.get(table.id)||"";
  const graphicsField=table.fields.find(isGraphicsField),graphicsFilter=graphicsFilters.get(table.id)||"";
  const fixesField=table.fields.find(isFixesField),fixFilter=fixFilters.get(table.id)||"";
  const records=table.records.map((record,index)=>({record,index})).filter(item=>(!machineFilter||!machineField||item.record[machineField]===machineFilter)&&(!graphicsFilter||!graphicsField||item.record[graphicsField]===graphicsFilter)&&(!fixFilter||!fixesField||parseFixes(item.record[fixesField]).includes(fixFilter)));
  if(!records.length)return `<div class="no-records">No matching records.</div>`;
  const seenMachines=new Set();
  const rows=records.map(({record,index})=>{const machineKey=machineField?String(record[machineField]||"").trim().toLowerCase():"",repeatMachine=Boolean(machineKey&&seenMachines.has(machineKey));if(machineKey)seenMachines.add(machineKey);return `<tr>${table.fields.map(field=>`<td>${isMachineNameField(field)&&repeatMachine?"":isFixesField(field)?`<div class="fix-cell">${parseFixes(record[field]).map(fix=>`<span class="fix-line">${fixMarkup(fix)}</span>`).join("")}</div>`:safe(record[field]||"")}</td>`).join("")}<td><button class="row-button" data-action="edit-record" data-index="${index}">Edit</button> <button class="row-button danger" data-action="delete-record" data-index="${index}">×</button></td></tr>`}).join("");
  return `<div class="scroll"><table><thead><tr>${table.fields.map(field=>`<th>${safe(field)}</th>`).join("")}<th>Actions</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}
function closeEditors(card){card.querySelectorAll(".editor").forEach(editor=>editor.classList.remove("open"));editingRecord=null}
function commitOpenRecord(){const editor=document.querySelector(".record-editor.open");if(!editor)return {committed:false};const card=editor.closest(".table-card"),table=tableById(card?.dataset.table);if(!table)return {committed:false};const values={};let hasValue=false;table.fields.forEach((field,index)=>{const value=editor.querySelector(`[data-field-index="${index}"]`)?.value.trim()||"";values[field]=value;if(value)hasValue=true});if(!hasValue)return {committed:false,empty:true};labelConsoleOnlyRecord(values,table.fields);const wasEditing=editingRecord?.tableId===table.id;if(wasEditing)table.records[editingRecord.index]=values;else table.records.push(values);editingRecord=null;return {committed:true,wasEditing}}
async function autosaveOpenRecord(){const editor=document.querySelector(".record-editor.open");if(!editor)return;const card=editor.closest(".table-card"),table=tableById(card?.dataset.table);if(!table)return;const values={};let hasValue=false;table.fields.forEach((field,index)=>{const value=editor.querySelector(`[data-field-index="${index}"]`)?.value.trim()||"";values[field]=value;if(value)hasValue=true});if(!hasValue)return;labelConsoleOnlyRecord(values,table.fields);if(editingRecord?.tableId===table.id)table.records[editingRecord.index]=values;else{table.records.push(values);editingRecord={tableId:table.id,index:table.records.length-1}}const result=await request("/api/machine-log",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({project})});project=result.project}
function scheduleAutosave(){clearTimeout(autosaveTimer);autosaveTimer=setTimeout(()=>{autosaveQueue=autosaveQueue.then(autosaveOpenRecord).catch(error=>setStatus(error.message,true))},250)}
function confirmAction(title,text,accept){$("#confirmTitle").textContent=title;$("#confirmText").textContent=text;pendingConfirm=accept;$("#confirmModal").classList.add("open")}
$("#cancelTable").addEventListener("click",()=>$("#newTableForm").classList.remove("open"));
$("#createTable").addEventListener("click",async()=>{const name=$("#newTableName").value.trim();if(!name)return setStatus("Enter a table name.",true);let id=slug(name),suffix=2;while(tableById(id))id=`${slug(name)}-${suffix++}`;project.tables.push({id,name,fields:[],records:[],collapsed:false});$("#newTableForm").classList.remove("open");await save(`Table "${name}" created`)});
$("#saveAll").addEventListener("click",async()=>{clearTimeout(autosaveTimer);await autosaveQueue;const pending=commitOpenRecord();if(pending.empty)return setStatus("Enter at least one value before saving.",true);await save(pending.committed?(pending.wasEditing?"Record updated":"Record added"):"Machine Log saved")});
$("#resetAll").addEventListener("click",()=>confirmAction("Reset Machine Log?","Every table, field, and record will be removed.",async()=>{project={projectName:"Machine Log",tables:[]};await save("Machine Log reset")}));
$("#tables").addEventListener("click",async event=>{
  const button=event.target.closest("button[data-action]");if(!button)return;
  const card=button.closest(".table-card"),table=tableById(card.dataset.table);if(!table)return;
  const action=button.dataset.action;
  if(action==="close-fixes"){button.closest(".fix-picker")?.removeAttribute("open");return}
  if(action==="record"){if(!table.fields.length)return setStatus("Add at least one field first.",true);clearTimeout(autosaveTimer);await autosaveQueue;await autosaveOpenRecord();closeEditors(card);render();const refreshed=document.querySelector(`.table-card[data-table="${table.id}"]`);refreshed?.querySelector(".record-editor")?.classList.add("open");refreshed?.querySelector(".record-editor input")?.focus();return}
  if(action==="toggle-rom"){const field=card.querySelector(".record-editor .optional-rom");if(field){field.classList.add("open");field.querySelector("input")?.focus()}return}
  if(action==="cancel-editor"){clearTimeout(autosaveTimer);await autosaveQueue;await autosaveOpenRecord();closeEditors(card);render()}
  if(action==="save-record"||action==="save-record-add"){clearTimeout(autosaveTimer);await autosaveQueue;const values={};let hasValue=false;table.fields.forEach((field,index)=>{const value=card.querySelector(`[data-field-index="${index}"]`).value.trim();values[field]=value;if(value)hasValue=true});if(!hasValue)return setStatus("Enter at least one value.",true);labelConsoleOnlyRecord(values,table.fields);const wasEditing=editingRecord?.tableId===table.id;if(wasEditing)table.records[editingRecord.index]=values;else table.records.push(values);editingRecord=null;await save(wasEditing?"Record updated":"Record added");if(action==="save-record-add"){const refreshed=document.querySelector(`.table-card[data-table="${table.id}"]`),editor=refreshed?.querySelector(".record-editor");if(editor){editor.classList.add("open");table.fields.forEach((field,index)=>{editor.querySelector(`[data-field-index="${index}"]`).value=isMachineNameField(field)?values[field]||"":""});const next=table.fields.findIndex(field=>!isMachineNameField(field));editor.querySelector(`[data-field-index="${next<0?0:next}"]`)?.focus()}}}
  if(action==="edit-record"){const index=Number(button.dataset.index),record=table.records[index];closeEditors(card);editingRecord={tableId:table.id,index};card.querySelector(".record-editor").classList.add("open");table.fields.forEach((field,fieldIndex)=>{const control=card.querySelector(`[data-field-index="${fieldIndex}"]`),value=isRomField(field)&&["Console","-"].includes(record[field])?"":record[field]||"";control.value=value;if(isFixesField(field))setFixPickerValue(control.closest(".fix-picker"),value)});if(table.fields.some(field=>isRomField(field)&&record[field]&&!['Console','-'].includes(record[field])))card.querySelector(".record-editor .optional-rom")?.classList.add("open");card.querySelector(".record-editor input:not([type=hidden]):not([type=checkbox])")?.focus()}
  if(action==="delete-record"){const index=Number(button.dataset.index);confirmAction("Delete Record?","This machine-log record will be permanently removed.",async()=>{table.records.splice(index,1);await save("Record removed")})}
});
$("#tables").addEventListener("input",event=>{if(event.target.closest(".record-editor")&&event.target.matches("[data-field-index]"))scheduleAutosave()});
$("#tables").addEventListener("change",event=>{const machineFilter=event.target.closest("select[data-machine-filter]");if(machineFilter){machineFilters.set(machineFilter.dataset.machineFilter,machineFilter.value);render();return}const graphicsFilter=event.target.closest("select[data-graphics-filter]");if(graphicsFilter){graphicsFilters.set(graphicsFilter.dataset.graphicsFilter,graphicsFilter.value);render();return}const fixesFilter=event.target.closest("select[data-fixes-filter]");if(fixesFilter){fixFilters.set(fixesFilter.dataset.fixesFilter,fixesFilter.value);render();return}const fixOption=event.target.closest("[data-fix-option]");if(fixOption){syncFixPicker(fixOption.closest(".fix-picker"));scheduleAutosave();return}if(event.target.closest(".record-editor")&&event.target.matches("[data-field-index]"))scheduleAutosave()});
document.addEventListener("click",event=>document.querySelectorAll(".fix-picker[open]").forEach(picker=>{if(!picker.contains(event.target))picker.removeAttribute("open")}));
$("#confirmCancel").addEventListener("click",()=>{$("#confirmModal").classList.remove("open");pendingConfirm=null});
$("#confirmAccept").addEventListener("click",async()=>{const action=pendingConfirm;$("#confirmModal").classList.remove("open");pendingConfirm=null;if(action)await action()});
$("#confirmModal").addEventListener("click",event=>{if(event.target===$("#confirmModal"))$("#confirmCancel").click()});
$("#newTableName").addEventListener("keydown",event=>{if(event.key==="Enter")$("#createTable").click()});
load();
</script>
</body>
</html>
